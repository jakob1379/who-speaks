[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "st-who-speaks"
version = "0.1.0"
description = "Streamlit video transcription and speaker diarization prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=6.0.0",
    "ctranslate2>=4.7.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "mediapipe>=0.10.33",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "speechbrain>=1.0.3",
    "streamlit>=1.55.0",
    "structlog>=25.5.0",
    "torch>=2.11.0",
]

[project.scripts]
who-speaks = "st_who_speaks.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sample_smoke: sample media smoke test that may download model caches",
]

[tool.setuptools.packages.find]
include = ["st_who_speaks*"]
